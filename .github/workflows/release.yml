name: Release

on:
  release:
    types: [published]

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  homebrew:
    name: point the Homebrew formula and cask at the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mischasigtermans/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Rewrite the formula's source and its hash
        run: |
          export URL="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/source.tar.gz" "$URL"
          export SHA=$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)
          perl -pi -e 's|^  url ".*"|  url "$ENV{URL}"|; s|^  sha256 ".*"|  sha256 "$ENV{SHA}"|' Formula/clauset-cli.rb
          grep -q "$SHA" Formula/clauset-cli.rb

      - name: Rewrite the cask's version and the hash of its disk image
        run: |
          curl -fsSL -o "$RUNNER_TEMP/Clauset.dmg" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Clauset.dmg"
          export VERSION="${TAG#v}"
          export SHA=$(sha256sum "$RUNNER_TEMP/Clauset.dmg" | cut -d' ' -f1)
          perl -pi -e 's|^  version ".*"|  version "$ENV{VERSION}"|; s|^  sha256 ".*"|  sha256 "$ENV{SHA}"|' Casks/clauset.rb
          grep -q "$SHA" Casks/clauset.rb

      - name: Commit and push
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "clauset ${TAG#v}" Formula/clauset-cli.rb Casks/clauset.rb
          git push

  crate:
    name: publish to crates.io
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      # A published version can't be replaced, so the tag has to name it.
      - name: Check the tag against Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$version" = "$TAG" ] || { echo "::error::the tag is $TAG, Cargo.toml says $version"; exit 1; }

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
