<!doctype html>
<!-- The share image, 1200 by 630. Rendered to public/img/og.png with a headless browser; not served itself. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0d1017;
        color: #f2f3f7;
        font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.22);
        transform-origin: 0 50%;
      }
      .text {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 80px;
        display: flex;
        width: 640px;
        flex-direction: column;
        justify-content: center;
      }
      .icon {
        width: 112px;
        height: 112px;
      }
      h1 {
        margin-top: 36px;
        font-size: 92px;
        font-weight: 650;
        line-height: 1;
        letter-spacing: -2.4px;
      }
      p {
        margin-top: 24px;
        color: #b4b9cc;
        font-size: 38px;
        line-height: 1.25;
        letter-spacing: -0.4px;
      }
      .address {
        margin-top: 44px;
        color: #8d93a8;
        font-size: 26px;
      }
    </style>
  </head>
  <body>
    <img class="scene" src="../public/img/scene-dark.jpg" alt="" />
    <div class="text">
      <img class="icon" src="../public/img/icon.png" alt="" />
      <h1>Clauset</h1>
      <p>Every Claude Code account, in your menu bar.</p>
      <div class="address">clauset.app</div>
    </div>
  </body>
</html>
